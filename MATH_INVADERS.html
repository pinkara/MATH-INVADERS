<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH INVADERS</title>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- NOUVELLES POLICES RETRO -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <!-- 
      CHARGEMENT DE MATHJAX (pour le rendu LaTeX)
    -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']], // Pour les maths en ligne
          displayMath: [['$$', '$$'], ['\\[', '\\]']], // Pour les maths en affichage
          macros: {
            R: "\\mathbb{R}" // Macro pour \R -> \mathbb{R}
          }
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <!-- Fin de MathJax -->

    <style>
        body {
            font-family: 'VT323', monospace; /* Police par défaut changée */
        }
        
        /* Classes pour les polices */
        .font-press-start { font-family: 'Press Start 2P', cursive; }
        .font-vt323 { font-family: 'VT323', monospace; }

        /* Effets de lueur (glow) */
        .text-glow-lime {
            text-shadow: 0 0 6px rgba(163, 230, 54, 0.7), 0 0 10px rgba(163, 230, 54, 0.5);
        }
        .text-glow-pink {
            text-shadow: 0 0 6px rgba(236, 72, 153, 0.7), 0 0 10px rgba(236, 72, 153, 0.5);
        }
        .box-glow-cyan {
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.5), 0 0 20px rgba(34, 211, 238, 0.3);
        }

        /* Style pour l'affichage (MathJax s'en occupe) */
        #problem-display {
            font-family: 'VT323', monospace;
            font-size: 1.5rem; /* Augmenté pour la lisibilité de VT323 */
            line-height: 2.2rem;
            min-height: 200px;
            display: block; /* Changé de 'flex' à 'block' */
            text-align: center;
            width: 100%;
            overflow-x: auto; /* Permet de scroller si le problème est trop large */
            padding: 1.5rem;
        }
        
        /* Style des onglets */
        .tab-btn {
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            border-radius: 0; /* Coins vifs */
            background-color: #1f2937; /* gray-800 */
            color: #22d3ee; /* cyan-400 */
            transition: all 0.2s ease-in-out;
            border: 2px solid #3b82f6; /* blue-500 */
            text-transform: uppercase; /* Style arcade */
            font-size: 1.25rem; /* Plus grand */
        }
        .tab-btn:hover {
            background-color: #374151; /* gray-700 */
            color: #ec4899; /* pink-500 */
        }
        .tab-btn.active {
            background-color: #ec4899; /* pink-500 */
            color: white;
            border-color: #f9a8d4; /* pink-300 */
            box-shadow: 0 0 8px rgba(236, 72, 153, 0.7);
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4 text-gray-100">

    <div class="bg-black p-8 md:p-12 rounded-none shadow-2xl max-w-3xl w-full border-4 border-cyan-500 box-glow-cyan">
        
        <h1 class="font-press-start text-3xl md:text-4xl font-bold text-center text-lime-400 mb-8 text-glow-lime">
            MATH INVADERS
        </h1>

        <!-- NOUVEAU: Onglets de sélection -->
        <div id="tabs" class="flex flex-wrap justify-center space-x-2 mb-8 font-vt323">
            <button data-type="integral" class="tab-btn active">Intégrales</button>
            <button data-type="derivative" class="tab-btn">Dérivées</button>
            <button data-type="linalg" class="tab-btn">Algèbre Linéaire</button>
            <button data-type="limit" class="tab-btn">Limites</button>
        </div>

        <!-- Bouton pour générer -->
        <button id="generate-btn" class="w-full bg-lime-400 text-black py-3 px-6 rounded-none font-semibold text-2xl hover:bg-lime-300 transition duration-300 ease-in-out shadow-lg focus:outline-none focus:ring-2 focus:ring-lime-300 focus:ring-opacity-50 font-vt323 uppercase">
            Générer un nouveau défi
        </button>

        <!-- Bouton pour la solution -->
        <a id="solve-link" 
           href="#" 
           target="_blank" 
           rel="noopener noreferrer"
           class="w-full bg-cyan-500 text-black py-3 px-6 rounded-none font-semibold text-2xl hover:bg-cyan-400 transition duration-300 ease-in-out shadow-lg focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-opacity-50 mt-4 text-center hidden block font-vt323 uppercase">
            Voir la solution
        </a>

        <!-- Zone d'affichage -->
        <div class="mt-8 bg-black rounded-none border-2 border-pink-500 min-h-[200px] flex items-center justify-center text-center overflow-hidden">
            <div id="problem-display" class="text-white">
                Chargement...
            </div>
        </div>

    </div>

    <script>
        // Références aux éléments du DOM
        const display = document.getElementById('problem-display');
        const generateButton = document.getElementById('generate-btn');
        const solveLink = document.getElementById('solve-link');
        const tabsContainer = document.getElementById('tabs');

        // --- État de l'application ---
        let currentQuery = ''; // Requête en texte brut pour WolframAlpha
        let currentCategory = 'integral'; // Catégorie active

        // --- Fonctions utilitaires ---
        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const randPick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const randSign = () => randPick(['+', '-']);
        const randCoeff = (nonZero = false) => {
            let c = randInt(-5, 5);
            if (nonZero && c === 0) c = 1;
            return c;
        };

        // --- Bassins de fonctions (retournent {latex, query}) ---
        // (Identiques à avant)
        const baseFuncs = [
            () => { const p = randInt(2, 5); return { latex: `x^${p}`, query: `x^${p}` }; },
            () => { const n = randInt(2, 7); const p = randInt(2, 5); return { latex: `${n}x^${p}`, query: `${n}*x^${p}` }; },
            () => { const n = randInt(2, 5); return { latex: `\\sin(${n}x)`, query: `sin(${n}*x)` }; },
            () => { const n = randInt(2, 5); return { latex: `\\cos(${n}x)`, query: `cos(${n}*x)` }; },
            () => { const n = randInt(2, 5); return { latex: `\\tan(${n}x)`, query: `tan(${n}*x)` }; },
            () => { const n = randInt(2, 5); return { latex: `e^{${n}x}`, query: `exp(${n}*x)` }; },
            () => { const n = randInt(2, 5); return { latex: `\\ln(${n}x)`, query: `ln(${n}*x)` }; },
            () => { const p = randInt(2, 3); const n = randInt(1, 9); return { latex: `\\sqrt{x^${p} + ${n}}`, query: `sqrt(x^${p} + ${n})` }; },
            () => { const p = randInt(2, 3); const n = randInt(1, 9); return { latex: `\\frac{1}{x^${p} + ${n}}`, query: `1 / (x^${p} + ${n})` }; },
            () => { const p = randInt(2, 3); return { latex: `\\sin(x^${p})`, query: `sin(x^${p})` }; },
            () => { return { latex: `\\cos(e^x)`, query: `cos(exp(x))` }; },
            () => { const n = randInt(1, 3); return { latex: `e^{\\sin(${n}x)}`, query: `exp(sin(${n}*x))` }; },
            () => { return { latex: `\\ln(\\sin(x))`, query: `ln(sin(x))` }; },
            () => { const p = randInt(1, 3); const n = randInt(1, 3); return { latex: `x^${p} e^{${n}x}`, query: `x^${p} * exp(${n}*x)` }; },
            () => { const p = randInt(2, 3); return { latex: `\\frac{(\\ln(x))^${p}}{x}`, query: `(ln(x))^${p} / x` }; },
            () => { const n = randInt(1, 9); return { latex: `\\frac{1}{\\sqrt{${n} - x^2}}`, query: `1 / sqrt(${n} - x^2)` }; },
            () => { const n = randInt(1, 9); return { latex: `\\frac{1}{x^2 + ${n}}`, query: `1 / (x^2 + ${n})` }; },
            () => { const p = randInt(2, 4); return { latex: `x^${p} \\ln(x)`, query: `x^${p} * ln(x)` }; }
        ];

        const proFuncs = [
            () => { const n = randInt(1,3); return { latex: `\\frac{\\arctan(${n}x)}{x}`, query: `arctan(${n}*x) / x` }; },
            () => { const n = randInt(0, 2); return { latex: `J_${n}(x)`, query: `BesselJ(${n}, x)` }; },
            () => { return { latex: `\\frac{x^n}{\\sqrt{1-x^2}}`, query: `x^n / sqrt(1-x^2)` }; },
            () => { return { latex: `\\frac{x^a - x^b}{\\ln(x)}`, query: `(x^a - x^b) / ln(x)` }; },
            () => { const p = randInt(1, 2); return { latex: `\\frac{\\ln(1 + x^${p})}{x}`, query: `ln(1 + x^${p}) / x` }; },
            () => { const n = randInt(2, 4); return { latex: `\\text{Li}_${n}(x)`, query: `PolyLog(${n}, x)` }; },
            () => { return { latex: `\\frac{\\sin(x)}{x}`, query: `sin(x) / x` }; },
            () => { return { latex: `\\ln(\\Gamma(x))`, query: `ln(Gamma(x))` }; },
            () => { return { latex: `x^n (1-x)^m`, query: `x^n * (1-x)^m` }; },
            () => { const n = randInt(3, 4); const p = randInt(3, 4); return { latex: `\\frac{1}{\\sqrt[${n}]{1-x^${p}}}`, query: `1 / (1-x^${p})^(1/${n})` }; },
            () => { return { latex: `\\sin(x^2)`, query: `sin(x^2)` }; },
            () => { return { latex: `\\cos(x^2)`, query: `cos(x^2)` }; },
            () => { return { latex: `e^{-x^2}`, query: `exp(-x^2)` }; },
            () => { return { latex: `x^x`, query: `x^x` }; } // Ajouté pour les dérivées
        ];

        const allFuncs = baseFuncs.concat(proFuncs).concat(proFuncs);
        const getRandFunc = () => randPick(allFuncs)();

        // --- Générateur de Termes (pour Intégrales/Dérivées) ---
        function generateTerm() {
            const structType = randInt(1, 4);
            const f = getRandFunc();
            let g, composer, denom;

            switch (structType) {
                case 1: return f;
                case 2:
                    g = getRandFunc();
                    return { latex: `${f.latex} \\cdot ${g.latex}`, query: `(${f.query}) * (${g.query})` };
                case 3:
                    g = getRandFunc();
                    const composers = [
                        { latex: '\\sin', query: 'sin' }, { latex: '\\cos', query: 'cos' },
                        { latex: '\\tan', query: 'tan' }, { latex: '\\ln', query: 'ln' },
                        { latex: 'e^', query: 'exp' }
                    ];
                    composer = randPick(composers);
                    if (composer.query === 'exp') {
                        return { latex: `e^{${g.latex}}`, query: `exp(${g.query})` };
                    }
                    return { latex: `${composer.latex}(${g.latex})`, query: `${composer.query}(${g.query})` };
                case 4:
                    const denominators = [
                        () => { const p = randInt(1, 3); return { latex: `x^${p}`, query: `x^${p}` }; },
                        () => { return { latex: `(1 + x^2)`, query: `(1 + x^2)` }; },
                        () => { const r = getRandFunc(); return { latex: `(1 + ${r.latex})`, query: `(1 + ${r.query})` }; }
                    ];
                    denom = randPick(denominators)();
                    return { latex: `\\frac{${f.latex}}{${denom.latex}}`, query: `(${f.query}) / (${denom.query})` };
            }
            return f;
        }

        // --- GÉNÉRATEURS DE PROBLÈMES ---

        function generateIntegralProblem() {
            const numTerms = randInt(1, 2);
            let bodyLatex = [];
            let bodyQuery = [];
            for (let i = 0; i < numTerms; i++) {
                const term = generateTerm();
                bodyLatex.push(term.latex);
                bodyQuery.push(term.query);
            }
            const op = randSign();
            const combinedBodyLatex = bodyLatex.join(` ${op} `);
            const combinedBodyQuery = bodyQuery.join(` ${op} `);

            const addBounds = randInt(1, 4) > 1;
            if (addBounds) {
                const bounds = [
                    { a: '0', b: '1', a_q: '0', b_q: '1' },
                    { a: '0', b: '\\infty', a_q: '0', b_q: 'infinity' },
                    { a: '-\\infty', b: '\\infty', a_q: '-infinity', b_q: 'infinity' },
                    { a: '0', b: '\\pi/2', a_q: '0', b_q: 'pi/2' },
                    { a: '0', b: '\\pi', a_q: '0', b_q: 'pi' },
                    { a: '1', b: '\\infty', a_q: '1', b_q: 'infinity' },
                ];
                const { a, b, a_q, b_q } = randPick(bounds);
                return {
                    latex: `$$ \\int_{${a}}^{${b}} \\left( ${combinedBodyLatex} \\right) \\, dx $$`,
                    query: `integrate ${combinedBodyQuery} from ${a_q} to ${b_q}`
                };
            } else {
                return {
                    latex: `$$ \\int \\left( ${combinedBodyLatex} \\right) \\, dx $$`,
                    query: `integrate ${combinedBodyQuery}`
                };
            }
        }

        function generateDerivativeProblem() {
            const term = generateTerm();
            return {
                latex: `$$ \\text{Calculer la dérivée de la fonction } f(x) : $$
                          $$ f(x) = ${term.latex} $$`,
                query: `derivative of ${term.query}`
            };
        }

        function generateLinearAlgebraProblem() {
            const type = randPick(['eigen', 'kernel', 'inverse']);
            
            if (type === 'eigen') {
                const dim = randInt(2, 3);
                if (dim === 2) {
                    const [a, b, c, d] = [randCoeff(), randCoeff(), randCoeff(), randCoeff()];
                    return {
                        latex: `$$ \\text{Trouver les valeurs propres et vecteurs propres de la matrice A :} $$
                                  $$ A = \\begin{pmatrix} ${a} & ${b} \\\\ ${c} & ${d} \\end{pmatrix} $$`,
                        query: `eigenvalues of {{${a}, ${b}}, {${c}, ${d}}}`
                    };
                } else {
                    const [a, b, c, d, e, f, g, h, i] = [randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff()];
                    return {
                        latex: `$$ \\text{Trouver les valeurs propres et vecteurs propres de la matrice A :} $$
                                  $$ A = \\begin{pmatrix} ${a} & ${b} & ${c} \\\\ ${d} & ${e} & ${f} \\\\ ${g} & ${h} & ${i} \\end{pmatrix} $$`,
                        query: `eigenvalues of {{${a}, ${b}, ${c}}, {${d}, ${e}, ${f}}, {${g}, ${h}, ${i}}}`
                    };
                }
            }
            
            if (type === 'kernel') {
                const dim = randInt(2, 3);
                if (dim === 2) {
                    const [a, b, c, d] = [randCoeff(), randCoeff(), randCoeff(), randCoeff()];
                    return {
                        latex: `$$ \\text{Trouver le noyau (Ker f) de l'endomorphisme } f: \\R^2 \\to \\R^2 \\text{ défini par :} $$
                                  $$ f(x, y) = (${a}x ${b > 0 ? '+' : ''} ${b}y, ${c}x ${d > 0 ? '+' : ''} ${d}y) $$`,
                        query: `kernel of linear map f(x,y) = (${a}*x + ${b}*y, ${c}*x + ${d}*y)`
                    };
                } else {
                    const [a, b, c] = [randCoeff(true), randCoeff(), randCoeff()];
                    const [d, e, f] = [randCoeff(), randCoeff(true), randCoeff()];
                    const [g, h, i] = [randCoeff(), randCoeff(), randCoeff(true)];
                    return {
                        latex: `$$ \\text{Trouver le noyau (Ker f) de l'endomorphisme } f: \\R^3 \\to \\R^3 \\text{ défini par :} $$
                                  $$ f(x, y, z) = (${a}x ${b > 0 ? '+' : ''} ${b}y ${c > 0 ? '+' : ''} ${c}z, \\; ${d}x ${e > 0 ? '+' : ''} ${e}y ${f > 0 ? '+' : ''} ${f}z, \\; ${g}x ${h > 0 ? '+' : ''} ${h}y ${i > 0 ? '+' : ''} ${i}z) $$`,
                        query: `kernel of linear map f(x,y,z) = (${a}*x + ${b}*y + ${c}*z, ${d}*x + ${e}*y + ${f}*z, ${g}*x + ${h}*y + ${i}*z)`
                    };
                }
            }
            
            if (type === 'inverse') {
                const dim = randInt(2, 3);
                if (dim === 2) {
                    const [a, b, c, d] = [randCoeff(), randCoeff(), randCoeff(), randCoeff()];
                    return {
                        latex: `$$ \\text{Calculer l'inverse de la matrice A, si elle existe :} $$
                                  $$ A = \\begin{pmatrix} ${a} & ${b} \\\\ ${c} & ${d} \\end{pmatrix} $$`,
                        query: `inverse of {{${a}, ${b}}, {${c}, ${d}}}`
                    };
                } else { // dim === 3
                    const [a, b, c, d, e, f, g, h, i] = [randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff(), randCoeff()];
                    return {
                        latex: `$$ \\text{Calculer l'inverse de la matrice A, si elle existe :} $$
                                  $$ A = \\begin{pmatrix} ${a} & ${b} & ${c} \\\\ ${d} & ${e} & ${f} \\\\ ${g} & ${h} & ${i} \\end{pmatrix} $$`,
                        query: `inverse of {{${a}, ${b}, ${c}}, {${d}, ${e}, ${f}}, {${g}, ${h}, ${i}}}`
                    };
                }
            }
        }

        // --- NOUVEAU: Générateur de Problèmes de Limites ---
        function generateLimitProblem() {
            const f = getRandFunc();
            const g = getRandFunc();
            const n = randInt(2, 5);
            const a = randInt(1, 5);
            
            const points = [
                { latex: '0', query: '0' },
                { latex: '\\infty', query: 'infinity' },
                { latex: 'a', query: 'a' },
                { latex: `${a}`, query: `${a}` }
            ];
            const point = randPick(points);

            const problemTemplates = [
                // 0/0 (L'Hopital)
                () => { 
                    const num = randPick([`\\sin(${a}x)`, `e^x - 1`, `\\ln(1+x)`]);
                    const den = randPick([`x`, `\\tan(${a}x)`, `x^2`]);
                    return { 
                        latex: `$$ \\lim_{x \\to 0} \\frac{${num}}{${den}} $$`, 
                        query: `limit ( ${num.replace(/\\/g,'')} ) / ( ${den.replace(/\\/g,'')} ) as x->0` 
                    };
                },
                // inf/inf (Polynomials)
                () => { 
                    const p1 = `x^${randInt(2, 4)}`;
                    const p2 = `x^${randInt(2, 4)}`;
                    const c1 = randCoeff(true);
                    const c2 = randCoeff(true);
                    return { 
                        latex: `$$ \\lim_{x \\to \\infty} \\frac{${c1 > 0 ? '' : '-'}${Math.abs(c1)}${p1} ${randSign()} ${a}x}{${c2 > 0 ? '' : '-'}${Math.abs(c2)}${p2} ${randSign()} ${randInt(1,5)}} $$`, 
                        query: `limit (${c1}*${p1} + ${a}*x) / (${c2}*${p2} - ${randInt(1,5)}) as x->infinity` 
                    };
                },
                // Quotient de fonctions
                () => {
                    return {
                        latex: `$$ \\lim_{x \\to ${point.latex}} \\frac{${f.latex}}{${g.latex}} $$`,
                        query: `limit (${f.query}) / (${g.query}) as x->${point.query}`
                    };
                },
                // Définition de e^x
                () => {
                    return {
                        latex: `$$ \\lim_{x \\to \\infty} \\left( 1 + \\frac{${a}}{x} \\right)^{${n}x} $$`,
                        query: `limit (1 + ${a}/x)^(${n}*x) as x->infinity`
                    };
                }
            ];
            
            // Exécute un des modèles de problème
            return randPick(problemTemplates)();
        }


        // --- Contrôleur Principal ---
        function generateProblem() {
            // Cache le bouton solution pendant la génération
            solveLink.classList.add('hidden');
            display.textContent = "Génération en cours..."; // Message de chargement

            let problem;
            switch (currentCategory) {
                case 'integral':
                    problem = generateIntegralProblem();
                    break;
                case 'derivative':
                    problem = generateDerivativeProblem();
                    break;
                case 'linalg':
                    problem = generateLinearAlgebraProblem();
                    break;
                case 'limit': // Ajout du cas pour les limites
                    problem = generateLimitProblem();
                    break;
                default:
                    problem = generateIntegralProblem();
            }

            currentQuery = problem.query; // Stocke la nouvelle requête
            display.textContent = problem.latex; // Met le LaTeX dans l'élément

            // 2. Demander à MathJax de "composer" (rendre) cet élément
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([display]).then(() => {
                    // Une fois le rendu terminé, on met à jour le lien et on l'affiche
                    const wolframURL = `https://www.wolframalpha.com/input/?i=${encodeURIComponent(currentQuery)}`;
                    solveLink.href = wolframURL;
                    solveLink.classList.remove('hidden');
                }).catch((err) => console.log(err.message));
            }
        }

        // --- Écouteurs d'événements ---
        
        // Clic sur le bouton "Générer"
        generateButton.addEventListener('click', generateProblem);

        // Clic sur les onglets
        tabsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-btn')) {
                // Met à jour la catégorie
                currentCategory = e.target.dataset.type;
                
                // Met à jour le style des onglets
                tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                e.target.classList.add('active');
                
                // Génère un nouveau problème de cette catégorie
                generateProblem();
            }
        });

        // Génère un premier problème APRÈS le chargement de MathJax
        document.getElementById('MathJax-script').addEventListener('load', () => {
            console.log('MathJax est chargé.');
            generateProblem();
        });
        
        if (window.MathJax && window.MathJax.startup) {
             window.MathJax.startup.promise.then(() => {
                console.log('MathJax était déjà prêt.');
                generateProblem();
            });
        }
    </script>
</body>
</html>
